name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/coach-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p coach-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coach
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coach
      NEO4J_DATABASE: neo4j
      NEO4J_PASSWORD: coach-password
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify idempotent seed
        run: |
          pnpm seed > "$RUNNER_TEMP/seed-first.json"
          pnpm seed > "$RUNNER_TEMP/seed-second.json"
          diff --unified "$RUNNER_TEMP/seed-first.json" "$RUNNER_TEMP/seed-second.json"
      - name: Verify resolver and safety seams without provider keys
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: uv run --directory backend pytest tests/test_resolver.py tests/test_safety.py
      - run: ./scripts/gate.sh api
