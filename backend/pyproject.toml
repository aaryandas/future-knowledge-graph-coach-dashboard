[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.2.11",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "neo4j>=6.0.3",
    "numpy>=2.4.2",
    "openai>=2.28.0",
    "psycopg[binary]>=3.3.3",
    "rapidfuzz>=3.14.3",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
