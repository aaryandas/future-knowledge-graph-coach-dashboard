[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
