name: future-knowledge-graph-coach-dashboard

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coach
      NEO4J_DATABASE: neo4j
      NEO4J_PASSWORD: coach-password
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/coach-password
    ports:
      - "127.0.0.1::7474"
      - "127.0.0.1::7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p coach-password 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - neo4j-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coach
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coach"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  neo4j-data:
  postgres-data:
